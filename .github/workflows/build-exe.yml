# Builds ac_bridge.exe on a real Windows machine.
# PyInstaller cannot cross-compile, so this is the only way to get a Windows
# binary without having Windows at hand.
#
# After a successful run: Actions tab -> pick the run -> Artifacts.
name: build-exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lets you trigger it by hand from the Actions tab

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: pc-app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Protocol self-check
        working-directory: pc-app
        run: python acbridge/protocol.py

      - name: Build
        working-directory: pc-app
        run: python -m PyInstaller --clean --noconfirm ac_bridge.spec

      - name: Does the .exe even start
        working-directory: pc-app
        run: ./dist/ac_bridge.exe --list-ports

      - uses: actions/upload-artifact@v4
        with:
          name: ac_bridge-windows
          path: pc-app/dist/ac_bridge.exe
          if-no-files-found: error

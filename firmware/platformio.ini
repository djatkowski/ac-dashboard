; M5Stack Tab5 - Assetto Corsa dashboard
;
; NOTE: the official platform-espressif32 does not support the ESP32-P4.
; We use the pioarduino fork - it is the only way to build for the Tab5.
; The board definition lives in boards/m5stack_tab5.json (pioarduino has none).

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack_tab5
framework = arduino

; The speed is nominal - USB CDC runs at full USB speed regardless.
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2

lib_deps =
    m5stack/M5Unified@^0.2.22   ; 0.2.22 is the first release that knows the Tab5
    m5stack/M5GFX@^0.2.29

; tools/ holds a parser test that runs on a PC, not on the board.
build_src_filter = +<*> -<../tools/>

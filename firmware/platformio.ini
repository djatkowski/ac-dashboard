; M5Stack Tab5 - dashboard do Assetto Corsa
;
; UWAGA: oficjalny platform-espressif32 nie obsluguje ESP32-P4.
; Uzywamy forka pioarduino - to jedyny sposob, zeby zbudowac na Tab5.
; Definicja plytki lezy w boards/m5stack_tab5.json (pioarduino jej nie ma).

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack_tab5
framework = arduino

; Predkosc jest umowna - USB CDC leci pelna predkoscia USB.
monitor_speed = 115200
upload_speed = 1500000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2

lib_deps =
    m5stack/M5Unified@^0.2.22   ; 0.2.22 to pierwsze wydanie ze wsparciem Tab5
    m5stack/M5GFX@^0.2.29

; Katalog tools/ zawiera test parsera uruchamiany na PC, nie na plytce.
build_src_filter = +<*> -<../tools/>
